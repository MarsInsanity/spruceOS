#!/bin/sh
# Anbernic RG552 (RK3399, 1920x1152) on dArkMoss. The base is built like the
# rk3326 units (Rockchip 4.4 kernel, Mali blob, RGA-rotated SDL), see
# dArkMoss's build_rg552.sh. Its joypad is the odroidgo3-joypad "GO-Super
# Gamepad" with the G350's product/revision and button codes (both units'
# dts), so the pad facts below are the G350's. Everything marked UNVERIFIED was
# taken from the device tree or AmberELEC/ROCKNIX, not read off a unit.

. /mnt/SDCARD/spruce/scripts/platform/darkmoss/dArkMossCommon.cfg

  #################################
#####   IDENTITY AND FIRMWARE   #####
  #################################

export BRAND="Anbernic"
export SPRUCE_DEVICE_NAME="Anbernic RG552"
export SYSTEM_JSON="/mnt/SDCARD/Saves/rg552-system.json"
export SYSTEM_JSON_DEFAULT="/mnt/SDCARD/App/PyUI/main-ui/devices/darkmoss/json/rg552-system.json"

  ###################################
#####   DISPLAY CHARACTERISTICS   #####
  ###################################

# A 1152x1920 portrait DSI panel used in landscape. The base boots it with
# fbcon=rotate:3 and its SDL is the RGA ROT_270 build, so SDL/KMSDRM clients
# see 1920x1152 landscape, as on the Miniloong and V10. PyUI rotates itself.
export DISPLAY_WIDTH="1920"
export DISPLAY_HEIGHT="1152"
export DISPLAY_ROTATION="0"
export DISPLAY_ASPECT_RATIO="5:3"
export DISPLAY_TEXT_ELF_WIDTH="1800"

  ########################
#####   CPU SETTINGS   #####
  ########################

# RK3399: cpu0-3 are Cortex-A53 (408000 600000 816000 1008000 1200000 1416000),
# cpu4-5 Cortex-A72 (... 1608000 1800000). cpu_control_functions writes the
# same limits to both clusters; the kernel clamps each one to its own table.
# All six cores stay online: the common 0123 would park both big cores.
export DEVICE_MIN_CORES_ONLINE=0
export DEVICE_MAX_CORES_ONLINE=012345
export DEVICE_POWERSAVE_LOW_FREQ=408000
export DEVICE_POWERSAVE_HIGH_FREQ=1008000

export CPU_SMART_CORES_ONLINE=012345
export CPU_SMART_MIN_FREQ=408000
export CPU_SMART_MAX_FREQ=1800000
export CPU_PERF_MAX_FREQ=1800000
# AmberELEC's kernel may carry a 2 GHz big-core point; without it this clamps
# to 1800000, so it is safe either way.
export CPU_OVERCLOCK_MAX_FREQ=2016000

# Mali-T860: 200 300 400 600 800 MHz (rk3399-opp.dtsi).
export GPU_GOVENOR_DIR="/sys/devices/platform/ff9a0000.gpu/devfreq/ff9a0000.gpu"
export GPU_SMART_MAX_FREQ="800000000"
export GPU_PERFORMANCE_MAX_FREQ="800000000"
export GPU_OVERCLOCK_MAX_FREQ="800000000"

# The RGB30 build targets the A55 (ARMv8.2) and dies with SIGILL on the
# A53/A72; the rk3326 one is plain ARMv8.0.
export PSP_BIN="PPSSPPSDL_dArkMoss3326"

  ##################################################
#####   OTHER HARDWARE FEATURES AND INTERFACES   #####
  ##################################################

# The fuel gauge registers as "bat" on this kernel (cw2015 driver), not
# "battery": take whichever supply calls itself a Battery.
for _ps in /sys/class/power_supply/*; do
    [ "$(cat "$_ps/type" 2>/dev/null)" = "Battery" ] && { export BATTERY="$_ps"; break; }
done 2>/dev/null
unset _ps

# The es8316 driver owns the jack GPIO and switches the speaker itself
# (RG552.sh leaves the path alone). Volume is spruce's softvol "Master".
export AUDIO_PATH_SPK="SPK"
export AUDIO_PATH_HP="HP"
export VOLUME_CONTROL="Master"
export DARKMOSS_VOLUME_READ_MAPPED=1
export DARKMOSS_SEED_SYSTEM_JSON=1
export DEVICE_NUM_ANALOG_STICKS=2
export DEVICE_SUPPORTS_PORTMASTER="true"
export LED_PATH="/sys/class/leds/battery_green"

# Fan: dArkMoss's rg552-fan owns it; the Fan Control app sets the mode.
export DEVICE_HAS_FAN="true"
export FAN_CONTROL_CMD="/usr/local/bin/rg552-fan"

# Android lives on the eMMC; rg552-bootswitch hands the next boot to it.
export BOOT_SWITCH_CMD="/usr/local/sbin/rg552-bootswitch"

# GT927 on the in-tree goodix driver, reporting in the panel's native portrait
# frame; PyUI undoes the 270 degree rotation (devices/darkmoss/rg552.py).
export DEVICE_HAS_TOUCHSCREEN="true"
_rg552_touch=""
for _d in /sys/class/input/event*; do
    case "$(cat "$_d/device/name" 2>/dev/null)" in
        *oodix*|*ouch*) [ -n "$_rg552_touch" ] || _rg552_touch="/dev/input/${_d##*/}" ;;
    esac
done 2>/dev/null
export EVENT_PATH_TOUCH="$_rg552_touch"
unset _d _rg552_touch

  ######################################
#####   KEY CODES AND INPUT EVENTS   #####
  ######################################

export PAD_NODE_CANDIDATES="/dev/input/by-path/platform-odroidgo3-joypad-event-joystick"
export PAD_NAME_CANDIDATES="GO-Super Gamepad"
export EVENT_PATH_READ_INPUTS_SPRUCE="/dev/input/by-path/platform-odroidgo3-joypad-event-joystick"
export EVENT_PATH_SEND_TO_RA_AND_PPSSPP="$EVENT_PATH_READ_INPUTS_SPRUCE"
export EVENT_PATH_SEND_TO_DRASTIC="$EVENT_PATH_READ_INPUTS_SPRUCE"

export EVENT_PATH_POWER="/dev/input/event0"
export EVENT_PATH_VOLUME="$EVENT_PATH_POWER"
export SPRUCE_INPUT_NODES_FILE="/tmp/rg552_input_nodes"
[ -f "$SPRUCE_INPUT_NODES_FILE" ] && . "$SPRUCE_INPUT_NODES_FILE"

export B_UP="1 544"
export B_DOWN="1 545"
export B_LEFT="1 546"
export B_RIGHT="1 547"

export B_A="1 305"    # BTN_EAST
export B_B="1 304"    # BTN_SOUTH
export B_X="1 307"    # BTN_NORTH
export B_Y="1 308"    # BTN_WEST

export B_L1="1 310"
export B_R1="1 311"
export B_L2="1 312"
export B_R2="1 313"

# F1-F5 are BTN_TRIGGER_HAPPY1-5: select, start, L3, R3 and the F key.
export B_SELECT="1 704"
export B_START="1 705"
export B_L3="1 706"
export B_R3="1 707"
export B_MENU="1 708"
export B_HOME="DOESNT_EXIST"

# Same joypad-product/revision/name as the G350 and A10 Mini, so the same GUID.
export SDL_GAMECONTROLLER_MAP="190000004b4800000011000000010000,GO-Super Gamepad,a:b1,b:b0,x:b2,y:b3,back:b12,guide:b16,start:b13,leftshoulder:b4,rightshoulder:b5,lefttrigger:b6,righttrigger:b7,leftstick:b14,rightstick:b15,dpup:b8,dpdown:b9,dpleft:b10,dpright:b11,leftx:a0,lefty:a1,rightx:a2,righty:a3,platform:Linux,"
export FLYCAST_PAD_MAP="G350"
# Same pad as the G350, so its mupen64plus pad table.
export MUPEN_PAD_TABLE="G350"

export STICK_LEFT="3 0"
export STICK_RIGHT="3 0"
export STICK_UP="3 1"
export STICK_DOWN="3 1"
export STICK_LEFT_2="3 3"
export STICK_RIGHT_2="3 3"
export STICK_UP_2="3 4"
export STICK_DOWN_2="3 4"

  ###############
#####   HDMI   #####
  ###############

export HDMI_STATE_PATH="/sys/class/drm/card0-HDMI-A-1/status"
export HDMI_WIDTH="1920"
export HDMI_HEIGHT="1080"
export HEADPHONE_STATE_PATH=""

  ##############################
#####   BRIGHTNESS MAPPING   #####
  ##############################

# The dts's brightness-levels run 0-100 (default 75). The panel's low end is
# UNVERIFIED; 3 is kept above black.
export SYSTEM_BACKLIGHT_LEVEL_0="3"
export SYSTEM_BACKLIGHT_LEVEL_1="5"
export SYSTEM_BACKLIGHT_LEVEL_2="8"
export SYSTEM_BACKLIGHT_LEVEL_3="12"
export SYSTEM_BACKLIGHT_LEVEL_4="18"
export SYSTEM_BACKLIGHT_LEVEL_5="26"
export SYSTEM_BACKLIGHT_LEVEL_6="35"
export SYSTEM_BACKLIGHT_LEVEL_7="46"
export SYSTEM_BACKLIGHT_LEVEL_8="60"
export SYSTEM_BACKLIGHT_LEVEL_9="78"
export SYSTEM_BACKLIGHT_LEVEL_10="100"

  #########################
#####   RetroArch Keys   #####
  #########################

RA_HOTKEY_LINE="input_enable_hotkey_btn"
RA_SELECT_VAL="12"
RA_START_VAL="13"
RA_HOME_VAL="16"
