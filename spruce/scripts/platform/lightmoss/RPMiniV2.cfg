#!/bin/sh
# Retroid Pocket Mini V2 (Snapdragon 865 / SM8250, Adreno 650, 1240x1080 AMOLED)
# on LightMoss (github.com/MarsInsanity/LightMoss, board rpminiv2): buildroot,
# systemd, NetworkManager and dropbear's "ssh" unit, mainline Linux 7.2 with
# ROCKNIX's SM8250 patches, Mesa freedreno. LightMoss hands off to spruce the
# way dArkMoss does, so this takes dArkMossCommon.cfg and changes what is
# RK3566 or Debian about it. Written from the device tree and LightMoss's
# sources, not yet read off a running unit: UNVERIFIED marks what wants
# checking first.

. /mnt/SDCARD/spruce/scripts/platform/darkmoss/dArkMossCommon.cfg

  #################################
#####   IDENTITY AND FIRMWARE   #####
  #################################

export BRAND="Retroid"
export SPRUCE_DEVICE_NAME="Retroid Pocket Mini V2"
export SYSTEM_JSON="/mnt/SDCARD/Saves/rpminiv2-system.json"
export SYSTEM_JSON_DEFAULT="/mnt/SDCARD/App/PyUI/main-ui/devices/lightmoss/json/rpminiv2-system.json"
export DARKMOSS_SEED_SYSTEM_JSON=1
# LightMoss updates itself (its LightMoss Update app); there is no dArkMoss
# firmware for this device.
unset TARGET_DARKMOSS_VERSION

  ###################################
#####   DISPLAY CHARACTERISTICS   #####
  ###################################

# The DSI panel scans out 1080x1240 portrait and is mounted landscape (the
# device tree's rotation = <90>, "Right Side Up"). LightMoss's system SDL2
# turns it with the primary plane, so SDL/KMSDRM programs (RetroArch,
# PortMaster ports) see 1240x1080 at 0, as on the E5 Plus with dArkMoss's RGA
# SDL. PyUI uses its own SDL and turns its canvas itself: SCREEN_ROTATION
# (UNVERIFIED which way: 270 if the menu comes out upside down).
export DISPLAY_WIDTH="1240"
export DISPLAY_HEIGHT="1080"
export DISPLAY_ROTATION="0"
# Neither "4:3" nor "16:9": the nearly square panel takes neither layout.
export DISPLAY_ASPECT_RATIO="31:27"
export DISPLAY_TEXT_ELF_WIDTH="1160"
# Diagnostic, temporary: an empty file named rpminiv2-no-rotation at the root
# of the card leaves the plane unturned for SDL programs (RetroArch, ports), so
# they come out sideways. Tells a fault in the plane rotation (the SDE rotator)
# from one in the program.
[ -e /mnt/SDCARD/rpminiv2-no-rotation ] && export SDL_KMSDRM_PANEL_ROTATION=0

  ########################
#####   CPU SETTINGS   #####
  ########################

# SM8250: policy0 = cpu0-3 (A55, 300-1804 MHz), policy4 = cpu4-6 (A77,
# 710-2419 MHz), policy7 = cpu7 (A77, 844-2841 MHz). RPMiniV2.sh sets every
# policy from its own limits; these name the cores only.
export DEVICE_MIN_CORES_ONLINE=0123
export DEVICE_MAX_CORES_ONLINE=01234567
export CPU_SMART_CORES_ONLINE=01234567
export CPU_SMART_GOVENOR="schedutil"
# The share of each policy's top speed powersave allows.
export LIGHTMOSS_POWERSAVE_PERCENT=60

# Adreno 650 (msm's devfreq). RPMiniV2.sh takes its top step from the node.
export GPU_GOVENOR_DIR="/sys/class/devfreq/3d00000.gpu"
export GPU_SMART_GOVERNOR="simple_ondemand"
export GPU_PERFORMANCE_GOVERNOR="performance"
export GPU_OVERCLOCK_GOVERNOR="performance"

  ##################################################
#####   OTHER HARDWARE FEATURES AND INTERFACES   #####
  ##################################################

# The pm8150b charger's battery: by type, as its name depends on the driver.
for _ps in /sys/class/power_supply/*; do
    [ "$(cat "$_ps/type" 2>/dev/null)" = "Battery" ] && { export BATTERY="$_ps"; break; }
done
unset _ps
# The panel's DCS brightness (0-255), the only backlight device.
for _bl in /sys/class/backlight/*; do
    [ -e "$_bl/brightness" ] && { export DEVICE_BACKLIGHT_PATH="$_bl/brightness"; break; }
done
unset _bl
# LightMoss's sound card service follows the jack and writes 1 or 0 here.
export HEADPHONE_STATE_PATH="/run/lightmoss/headphones"
# Sound levels (RPMiniV2.sh applies them). The speakers' digital gain in dB
# (WSA_RX0/RX1 Digital Volume, -84..+40; ROCKNIX's UCM boots it at +36 for a
# PipeWire volume to bring down). 0: the speaker path runs the codec's
# compander and the amplifiers' compressor (upstream UCM), which work from a
# 0 dB signal; at +6 music on Songo pumped, bass and level coming and going.
# Quiet games get RetroArch's own volume instead (retroarch-RPMiniV2.cfg).
# The menu's own sounds in dB, on its own ALSA output (spruce_menu, PyUI
# only): its sound files are full scale, and at 20/20 they hurt.
export LIGHTMOSS_SPEAKER_GAIN_DB=0
export LIGHTMOSS_MENU_SOUND_DB=-24
export PYUI_AUDIODEV="spruce_menu"
# Godot apps (Songo#5, Godot ports) ask ALSA for 15 ms by default: about two
# 512-frame periods, which the DSP's stream does not keep up with now that no
# dmix sits in front with its own 4096-frame buffer. 50 ms gives 2048-frame
# periods.
export GODOT_OPTS="--audio-output-latency 50"
export DEVICE_NUM_ANALOG_STICKS=2
export DEVICE_SUPPORTS_PORTMASTER="true"
export LED_PATH="not applicable"
# The same button order as the E5 Plus's pad (south, east, north, west, L1,
# R1, L2, R2, select, start, mode, L3, R3, d-pad 13-16; LightMoss reports L2/R2
# as buttons as well as axes); ABS_Z comes before the right stick, so its axes
# are 3 and 4. The GUID's name CRC is 0: SDL matches it to any name.
export SDL_GAMECONTROLLER_MAP="03000000202000000130000001000000,Retroid Pocket Gamepad,a:b1,b:b0,x:b2,y:b3,back:b8,guide:b10,start:b9,leftshoulder:b4,rightshoulder:b5,lefttrigger:b6,righttrigger:b7,leftstick:b11,rightstick:b12,dpup:b13,dpdown:b14,dpleft:b15,dpright:b16,leftx:a0,lefty:a1,rightx:a3,righty:a4,platform:Linux,"
export SATURN_PAD_TABLE="Miniloong"
export FLYCAST_PAD_MAP="RPMiniV2"

  ######################################
#####   KEY CODES AND INPUT EVENTS   #####
  ######################################

# The pad is the MCU behind ROCKNIX's retroid driver, found by name.
export PAD_NODE_CANDIDATES=""
export PAD_NAME_CANDIDATES="Retroid Pocket Gamepad"
export EVENT_PATH_READ_INPUTS_SPRUCE="/dev/input/event0"
export EVENT_PATH_SEND_TO_RA_AND_PPSSPP="$EVENT_PATH_READ_INPUTS_SPRUCE"
export EVENT_PATH_SEND_TO_DRASTIC="$EVENT_PATH_READ_INPUTS_SPRUCE"

# Nodes: pm8941_pwrkey (power), "LightMoss Volume Keys" (LightMoss merges the
# gpio-keys Volume Up and the PMIC's resin Volume Down into it, the one node
# that reports both), the pad. device_init resolves and persists them.
export EVENT_PATH_POWER="/dev/input/event0"
export EVENT_PATH_VOLUME="$EVENT_PATH_POWER"
export VOLUME_KEYS_ON_PAD="0"
export SPRUCE_INPUT_NODES_FILE="/tmp/rpminiv2_input_nodes"
[ -f "$SPRUCE_INPUT_NODES_FILE" ] && . "$SPRUCE_INPUT_NODES_FILE"

export B_UP="1 544"
export B_DOWN="1 545"
export B_LEFT="1 546"
export B_RIGHT="1 547"

export B_A="1 305"    # BTN_EAST
export B_B="1 304"    # BTN_SOUTH
export B_X="1 307"    # BTN_NORTH
export B_Y="1 308"    # BTN_WEST

export B_L1="1 310"
export B_R1="1 311"
export B_L2="1 312"   # BTN_TL2, past half travel (LightMoss's driver patch)
export B_R2="1 313"   # BTN_TR2

export B_L3="1 317"
export B_R3="1 318"

export B_START="1 315"
export B_SELECT="1 314"
export B_MENU="1 316"  # the home button (BTN_MODE)
export B_HOME="DOESNT_EXIST"

# Left stick ABS_X/ABS_Y, right stick ABS_RX/ABS_RY; ROCKNIX's driver reports
# about +-1400 at full travel (UNVERIFIED direction).
export STICK_LEFT="3 0"
export STICK_RIGHT="3 0"
export STICK_UP="3 1"
export STICK_DOWN="3 1"
export STICK_LEFT_2="3 3"
export STICK_RIGHT_2="3 3"
export STICK_UP_2="3 4"
export STICK_DOWN_2="3 4"

  ##############################
#####   BRIGHTNESS MAPPING   #####
  ##############################

# 0-255 DCS brightness on the AMOLED. UNVERIFIED on the panel.
export SYSTEM_BACKLIGHT_LEVEL_0="5"
export SYSTEM_BACKLIGHT_LEVEL_1="10"
export SYSTEM_BACKLIGHT_LEVEL_2="20"
export SYSTEM_BACKLIGHT_LEVEL_3="35"
export SYSTEM_BACKLIGHT_LEVEL_4="55"
export SYSTEM_BACKLIGHT_LEVEL_5="80"
export SYSTEM_BACKLIGHT_LEVEL_6="105"
export SYSTEM_BACKLIGHT_LEVEL_7="135"
export SYSTEM_BACKLIGHT_LEVEL_8="170"
export SYSTEM_BACKLIGHT_LEVEL_9="210"
export SYSTEM_BACKLIGHT_LEVEL_10="255"

  #########################
#####   RetroArch Keys   #####
  #########################

# RetroArch's udev indices, not SDL's: RetroArch counts keys up from BTN_MISC,
# so the pad's BTN_BACK (0x116) is its button 0 and everything after moves up
# one (select 9, start 10, mode 11). SDL puts BTN_BACK last.
RA_HOTKEY_LINE="input_enable_hotkey_btn"
RA_SELECT_VAL="9"
RA_START_VAL="10"
RA_HOME_VAL="11"

  ##################
#####   PyUI   #####
  ##################

# No Python device class: PyUI runs as the env-driven ENV_VAR device
# (App/PyUI/spruce-device-env.sh fills in the rest from the values above).
export PYUI_ENV_DEVICE="true"
export DEFAULT_CFG_PATH="$SYSTEM_JSON_DEFAULT"
export SCREEN_WIDTH="1240"
export SCREEN_HEIGHT="1080"
export SCREEN_ROTATION="90"
export POWER_OFF_CMD="systemctl poweroff"
export REBOOT_CMD="systemctl reboot"
export CONTROLLER_EVENT_FORMAT="llHHi"
export STICK_DEADZONE="600"
# LightMoss's Mesa (freedreno) has OpenGL ES and EGL but no libGL: ask SDL for
# an ES config, as the dArkMoss devices do (DarkmossDevice.wants_gles_context).
export WANTS_GLES_CONTEXT="true"
# And SDL's GLES2 renderer by name. SDL tries its desktop OpenGL renderer first
# (setting the context back to desktop GL itself), and Mesa can make a desktop
# GL context through EGL, so SDL kept that renderer, which has no render
# targets here: PyUI logged "Render targets not supported by OpenGL" for every
# frame and the panel stayed white or black. On the Mali units desktop GL fails
# outright and SDL falls back to GLES2 on its own.
export SDL_RENDER_DRIVER="opengles2"
# Exits 0 while headphones are in (LightMoss ships it; PyUI runs it without a shell).
export HEADPHONES_STATUS_CMD="/usr/bin/lightmoss-headphones"
