# Retroid Pocket Mini V2 internal pad (the MCU behind ROCKNIX's retroid
# driver, on LightMoss).
#
# Button numbers are RetroArch's udev indices: RetroArch counts the pad's keys
# up from BTN_MISC, so BTN_BACK (0x116, the Back button) comes first, at 0,
# then south, east, north, west (1-4), L1, R1 (5, 6), L2, R2 (7, 8: LightMoss
# reports the analog triggers as buttons too, past half travel), select,
# start, mode (9-11), L3, R3 (12, 13) and the d-pad as four buttons (14-17).
# SDL counts from BTN_JOYSTICK and puts Back last, so the SDL mapping in
# RPMiniV2.cfg starts at 0 with south. The axes: left stick 0/1, ABS_Z 2,
# right stick 3/4.
input_driver = "udev"
input_device = "Retroid Pocket Gamepad"
input_vendor_id = "8224"
input_product_id = "12289"

input_b_btn = "1"
input_a_btn = "2"
input_x_btn = "3"
input_y_btn = "4"

input_l_btn = "5"
input_r_btn = "6"
input_l2_btn = "7"
input_r2_btn = "8"

input_select_btn = "9"
input_start_btn = "10"

input_l3_btn = "12"
input_r3_btn = "13"

input_up_btn = "14"
input_down_btn = "15"
input_left_btn = "16"
input_right_btn = "17"

input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+3"
input_r_x_minus_axis = "-3"
input_r_y_plus_axis = "+4"
input_r_y_minus_axis = "-4"
