# Retroid Pocket Mini V2 internal pad (the MCU behind ROCKNIX's retroid
# driver, on LightMoss).
#
# Button numbers are RetroArch's udev indices, ascending evdev codes: south,
# east, north, west (0-3), L1, R1 (4, 5), L2, R2 (6, 7: LightMoss reports the
# analog triggers as buttons too, past half travel), select, start, mode (8-10),
# L3, R3 (11, 12), the d-pad as four buttons (13-16) and back (17). The axes:
# left stick 0/1, ABS_Z 2, right stick 3/4. UNVERIFIED on hardware.
input_driver = "udev"
input_device = "Retroid Pocket Gamepad"
input_vendor_id = "8224"
input_product_id = "12289"

input_b_btn = "0"
input_a_btn = "1"
input_x_btn = "2"
input_y_btn = "3"

input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"

input_select_btn = "8"
input_start_btn = "9"

input_l3_btn = "11"
input_r3_btn = "12"

input_up_btn = "13"
input_down_btn = "14"
input_left_btn = "15"
input_right_btn = "16"

input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+3"
input_r_x_minus_axis = "-3"
input_r_y_plus_axis = "+4"
input_r_y_minus_axis = "-4"
