name: RPMiniV2 test build

# A test package of this branch (mofang: spruce with the Retroid Pocket Mini V2
# on LightMoss), for trying it on a device. Same packaging as
# create-branch-alpha-release.yml, but published as a pre-release in this
# repository: that workflow publishes to spruceUI/spruceOSNightlies with a
# secret a fork does not have. Runs on every push to mofang (workflow_dispatch
# only works from the default branch). Modelled on rg552-test-build.yml; not
# meant for an upstream PR.
#
# The newest test build is always the release tagged exactly "RPMiniV2", so it
# can be fetched from one tag (the LightMoss image for the internal storage is
# lightmoss-rpminiv2-*.img.xz from MarsInsanity/LightMoss). Before publishing,
# the release it replaces is retagged rpminiv2-YYYYMMDD (the UTC day it was
# built; -2, -3 for further builds that day) at the same commit. Pre-release,
# so update-ota-on-publish.yml leaves it alone.

on:
  push:
    branches: [ mofang ]
  workflow_dispatch:

concurrency:
  group: rpminiv2-test-build
  cancel-in-progress: false

jobs:
  create-7z:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install 7zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Get version and tag
        id: get_version
        run: |
          BASE="$(< spruce/spruce)"
          # Named like upstream's nightlies (<base>-<YYYYMMDD>, UTC), which is what
          # spruce's updater compares (runtimeHelper.sh wants exactly 8 digits
          # after the dash); builds of one day are told apart by commit
          # (commits_nightly.txt "Last commit:" vs the feed's NIGHTLY_COMMIT).
          VERSION="${BASE}-$(date -u '+%Y%m%d')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=RPMiniV2" >> "$GITHUB_OUTPUT"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git fetch -q origin Development || true
          {
            echo "Last commit: $(git rev-parse HEAD)"
            echo "Branch: $GITHUB_REF_NAME"
            echo ""
            echo "Commits not in Development:"
            git log origin/Development..HEAD --pretty=tformat:'- %s (%an)' 2>/dev/null
          } > commits_nightly.txt

      - name: Write version marker
        run: |
          : > "${{ steps.get_version.outputs.version }}"

      - name: Recombine large files
        run: |
          if ls spruce/flip/miyoo355_rootfs_32.img_part* 1>/dev/null 2>&1; then
            rm -f spruce/flip/miyoo355_rootfs_32.img
            cat spruce/flip/miyoo355_rootfs_32.img_part* > spruce/flip/miyoo355_rootfs_32.img
            rm -f spruce/flip/miyoo355_rootfs_32.img_part*
          fi

          if ls spruce/flip/muOS-pixie-reduced.sqsh-part* 1>/dev/null 2>&1; then
            rm -f spruce/flip/muOS-pixie-reduced.sqsh
            cat spruce/flip/muOS-pixie-reduced.sqsh-part* > spruce/flip/muOS-pixie-reduced.sqsh
            rm -f spruce/flip/muOS-pixie-reduced.sqsh-part*
          fi

          if ls RetroArch/.retroarch/cores64/scummvm_libretro.so.part* 1>/dev/null 2>&1; then
            cat RetroArch/.retroarch/cores64/scummvm_libretro.so.part* > RetroArch/.retroarch/cores64/scummvm_libretro.so
            rm -f RetroArch/.retroarch/cores64/scummvm_libretro.so.part*
          fi

      - name: Pull selected PyUI Themes
        run: |
          mkdir -p Themes
          RELEASE_URL="https://github.com/spruceUI/PyUI-Themes/releases/download/1"

          wget -q --no-check-certificate -O "Themes/ALEKFULL_NX_ES.7z" "${RELEASE_URL}/ALEKFULL_NX_ES.7z" || true
          wget -q --no-check-certificate -O "Themes/ART_BOOK_OUTLINE.7z" "${RELEASE_URL}/ART_BOOK_OUTLINE.7z" || true
          wget -q --no-check-certificate -O "Themes/ART_BOOK_NEXT.7z" "${RELEASE_URL}/ART_BOOK_NEXT.7z" || true
          wget -q --no-check-certificate -O "Themes/Avocado.7z" "${RELEASE_URL}/Avocado.7z" || true
          wget -q --no-check-certificate -O "Themes/Cosy by KyleBing.7z" "${RELEASE_URL}/Cosy_by_KyleBing.7z" || true
          wget -q --no-check-certificate -O "Themes/Grape.7z" "${RELEASE_URL}/Grape.7z" || true
          wget -q --no-check-certificate -O "Themes/GREEN.7z" "${RELEASE_URL}/GREEN.7z" || true
          wget -q --no-check-certificate -O "Themes/HeyDW's Blue.7z" "${RELEASE_URL}/HeyDWs_Blue.7z" || true
          wget -q --no-check-certificate -O "Themes/M.7z" "${RELEASE_URL}/M.7z" || true
          wget -q --no-check-certificate -O "Themes/MINIMAL.7z" "${RELEASE_URL}/MINIMAL.7z" || true
          wget -q --no-check-certificate -O "Themes/MinUInspired (logos).7z" "${RELEASE_URL}/MinUInspired_(logos).7z" || true
          wget -q --no-check-certificate -O "Themes/OTB.7z" "${RELEASE_URL}/OTB.7z" || true
          wget -q --no-check-certificate -O "Themes/Pico-8.7z" "${RELEASE_URL}/Pico-8.7z" || true
          wget -q --no-check-certificate -O "Themes/SLABS.7z" "${RELEASE_URL}/SLABS.7z" || true
          wget -q --no-check-certificate -O "Themes/SPRUCE (simple).7z" "${RELEASE_URL}/SPRUCE_(simple).7z" || true

          find Themes -name "*.7z" -empty -delete
          ls -lh Themes

      - name: Archive Licenses folder
        run: |
          7z a -t7z -mx=9 Licenses.7z Licenses/
          rm -rf Licenses/

      - name: Create 7z archive
        run: |
          7z a -t7z -m0=lzma2:d=16m -mx=7 -ms=off -mf- "spruceV${{ steps.get_version.outputs.version }}.7z" * .tmp_update \
            -xr!.git \
            -xr!.github \
            -x!.gitignore \
            -x!.gitattributes \
            -x!create_spruce_release.bat \
            -x!create_spruce_release.sh \
            -x!commits_nightly.txt \
            -x!CLAUDE.md \
            -x!To-Do.txt

          7z u "spruceV${{ steps.get_version.outputs.version }}.7z" commits_nightly.txt

      - name: Publish the test build
        env:
          # RELEASE_TOKEN (repository secret, as for the RG552 and RG351P test
          # builds): a fine-grained token with Contents and Workflows write
          # here. The run token is refused (403) creating the release and
          # moving the previous one, on commits that carry workflow changes.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ steps.get_version.outputs.tag }}
          FILE: spruceV${{ steps.get_version.outputs.version }}.7z
        run: |
          ls -lh "$FILE"
          repo="$GITHUB_REPOSITORY"

          # archive OLD_TAG: move that release to rpminiv2-YYYYMMDD[-N] at the same commit.
          archive() {
            old="$1"
            created="$(gh release view "$old" --repo "$repo" --json createdAt -q .createdAt 2>/dev/null)" || return 0
            day="$(date -u -d "$created" +%Y%m%d)"
            read -r type sha < <(gh api "repos/${repo}/git/ref/tags/${old}" -q '.object.type + " " + .object.sha')
            [ "$type" = tag ] && sha="$(gh api "repos/${repo}/git/tags/${sha}" -q .object.sha)"
            new="rpminiv2-${day}"; n=2
            while gh api "repos/${repo}/git/ref/tags/${new}" >/dev/null 2>&1; do new="rpminiv2-${day}-${n}"; n=$((n + 1)); done
            # The release edit creates the new tag at --target; creating it through
            # the git refs API is refused to this token for commits that carry
            # workflow changes.
            gh release edit "$old" --repo "$repo" --tag "$new" --target "$sha"
            [ "$(gh release view "$new" --repo "$repo" --json tagName -q .tagName)" = "$new" ] \
              || { echo "::error::${old} did not move to ${new}"; exit 1; }
            gh api -X DELETE "repos/${repo}/git/refs/tags/${old}" \
              || echo "::warning::release moved to ${new}, but the old tag ${old} could not be deleted"
            echo "Archived ${old} (${sha}) as ${new}"
          }

          archive "$TAG"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ steps.get_version.outputs.sha }}" \
            --title "RPMiniV2 build (${{ steps.get_version.outputs.version }})" \
            --notes "spruce with the Retroid Pocket Mini V2, from \`mofang\` at \`${{ steps.get_version.outputs.sha }}\` (upstream spruceUI/spruceOS Development merged in). A device running an earlier RPMiniV2 build gets it from spruce's updater (Check for Updates), which reads this fork's feed (branch rpminiv2-ota), never spruceUI's. To install by hand, extract it to the root of the spruce card: the SPRUCEOS partition of the LightMoss card (made on its first boot), or a card formatted FAT32/exFAT. LightMoss itself runs from the internal storage (lightmoss-rpminiv2-*.img.xz from MarsInsanity/LightMoss; see README-LightMoss.txt on that image's card)." \
            --prerelease
          for attempt in 1 2 3; do
            timeout 900 gh release upload "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --clobber && break
            [ "$attempt" = 3 ] && { echo "::error::giving up on $FILE"; exit 1; }
            sleep 30
          done
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"

      # The update feed RPMiniV2's spruce reads (RPMiniV2.cfg SPRUCE_OTA_URL:
      # raw.githubusercontent.com, because the updater fetches the feed without
      # following redirects, as GitHub's release downloads need). It names this
      # build as the "nightly" (full updates only; the cfg pins the channel and
      # type) and, so nothing can ever offer spruceUI's stable instead, as the
      # "stable" too. Written only after the archive is uploaded, to the
      # rpminiv2-ota branch, which holds nothing else. The run token pushes it:
      # its pushes start no workflow.
      - name: Publish the update feed
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.get_version.outputs.version }}
          BASE_VERSION: ${{ steps.get_version.outputs.base }}
          SHA: ${{ steps.get_version.outputs.sha }}
          TAG: ${{ steps.get_version.outputs.tag }}
          FILE: spruceV${{ steps.get_version.outputs.version }}.7z
        run: |
          CHECKSUM="$(md5sum "$FILE" | cut -d' ' -f1)"
          SIZE_MB="$(ls -l --block-size=1M "$FILE" | awk '{print $5}')"
          LINK="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${FILE}"
          INFO="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          feed_dir="$(mktemp -d)"
          git -C "$feed_dir" init -q
          git -C "$feed_dir" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git -C "$feed_dir" fetch -q --depth 1 origin rpminiv2-ota 2>/dev/null; then
            git -C "$feed_dir" checkout -q -B rpminiv2-ota FETCH_HEAD
          else
            git -C "$feed_dir" checkout -q --orphan rpminiv2-ota
          fi
          mkdir -p "$feed_dir/OTA"
          {
            echo "RELEASE_VERSION=${BASE_VERSION}"
            echo "RELEASE_CHECKSUM=${CHECKSUM}"
            echo "RELEASE_SIZE_IN_MB=${SIZE_MB}"
            echo "RELEASE_LINK=${LINK}"
            echo "RELEASE_INFO=${INFO}"
            echo "NIGHTLY_VERSION=${VERSION}"
            echo "NIGHTLY_CHECKSUM=${CHECKSUM}"
            echo "NIGHTLY_SIZE_IN_MB=${SIZE_MB}"
            echo "NIGHTLY_LINK=${LINK}"
            echo "NIGHTLY_INFO=${INFO}"
            echo "NIGHTLY_COMMIT=${SHA}"
          } > "$feed_dir/OTA/spruce"
          cat > "$feed_dir/README.md" <<'README'
          The update feed of spruce for the Retroid Pocket Mini V2 (branch mofang),
          written by .github/workflows/rpminiv2-test-build.yml after each build.
          RPMiniV2.cfg points spruce's updater at OTA/spruce here.
          README
          sed -i 's/^          //' "$feed_dir/README.md"
          cat "$feed_dir/OTA/spruce"
          git -C "$feed_dir" add OTA/spruce README.md
          if git -C "$feed_dir" diff --cached --quiet; then
            echo "Feed unchanged"; exit 0
          fi
          git -C "$feed_dir" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "RPMiniV2 feed: ${VERSION} (${SHA:0:7})"
          for attempt in 1 2 3; do
            git -C "$feed_dir" push -q origin rpminiv2-ota && break
            [ "$attempt" = 3 ] && { echo "::error::could not push the update feed"; exit 1; }
            sleep 10
          done
          echo "Feed: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/rpminiv2-ota/OTA/spruce" >> "$GITHUB_STEP_SUMMARY"
